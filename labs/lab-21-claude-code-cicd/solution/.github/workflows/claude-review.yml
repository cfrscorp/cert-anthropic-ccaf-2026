name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Restore prior findings (dedupe across re-runs)
        uses: actions/cache@v4
        with:
          path: prior_findings.json
          key: claude-review-${{ github.event.pull_request.number }}

      - name: Run Claude Code review (non-interactive)
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          # -p / --print makes Claude Code non-interactive: it reads the prompt,
          # writes JSON to stdout, and exits (no hang waiting for input).
          # --output-format json + --json-schema force schema-compliant findings.
          # review.CLAUDE.md (checked in) supplies review criteria + fixtures, and
          # this is an INDEPENDENT review instance — it did not generate the code.
          claude -p "Review the files in changed_files.txt for bugs and security \
              issues using the criteria in review.CLAUDE.md. Prior findings are in \
              prior_findings.json — report only NEW or still-unaddressed issues. \
              Emit findings matching review-schema.json." \
            --output-format json \
            --json-schema review-schema.json \
            > review.json

      - name: Post findings as inline PR comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ci_review.py \
            --findings review.json \
            --schema review-schema.json \
            --prior prior_findings.json \
            --post
