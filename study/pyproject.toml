[project]
name = "ccaf-study"
version = "1.0.0"
description = "Local, offline study app + content for the CCAF exam (question bank, flashcards, concepts, readiness)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
